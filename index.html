<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>

  <!-- Google Font for Nepali/Sanskrit text -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    .title {
      font-size: 4rem;
      font-family: 'Noto Serif Devanagari', serif;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 1rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .title {
        font-size: 2.5rem;
      }

      .subtitle {
        font-size: 0.8rem;
        letter-spacing: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">चिरञ्जीवी भवः</div>
    <div class="subtitle">Coming Soon</div>
  </div>

</body>
</html>
