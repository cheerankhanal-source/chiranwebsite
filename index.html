<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chiranjibi Khanal</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      min-height:100vh;
      background:#000;
      overflow:hidden;
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* Animated background */
    body::before{
      content:"";
      position:absolute;
      width:200%;
      height:200%;
      background:
        radial-gradient(circle at center,
        rgba(255,255,255,0.05) 0%,
        transparent 60%);
      animation: rotateBg 14s linear infinite;
    }

    @keyframes rotateBg{
      from{
        transform:rotate(0deg);
      }
      to{
        transform:rotate(360deg);
      }
    }

    .container{
      position:relative;
      z-index:2;
      text-align:center;
      padding:20px;
    }

    .main-text{
      font-family:'Noto Serif Devanagari', serif;
      color:#fff;
      font-size:clamp(2.5rem, 8vw, 7rem);
      font-weight:700;
      letter-spacing:2px;
      line-height:1.2;
      animation: glow 4s ease-in-out infinite;
    }

    @keyframes glow{
      0%,100%{
        opacity:0.7;
        transform:scale(1);
        text-shadow:0 0 10px rgba(255,255,255,0.12);
      }

      50%{
        opacity:1;
        transform:scale(1.03);
        text-shadow:
          0 0 12px rgba(255,255,255,0.45),
          0 0 28px rgba(255,255,255,0.18);
      }
    }

    .bottom-text{
      position:fixed;
      bottom:90px; /* moved higher for iPhone browser UI */
      left:50%;
      transform:translateX(-50%);
      z-index:2;

      font-family:'Inter', sans-serif;
      color:rgba(255,255,255,0.65);
      font-size:clamp(0.75rem, 1.5vw, 1rem);
      letter-spacing:8px;
      text-transform:uppercase;

      white-space:nowrap;
    }

    @media (max-width:768px){

      .bottom-text{
        bottom:110px; /* extra safe spacing for Safari toolbar */
        letter-spacing:5px;
        font-size:0.8rem;
      }

    }

  </style>
</head>
<body>

  <div class="container">
    <div class="main-text">चिरञ्जीवी भवः</div>
  </div>

  <div class="bottom-text">ON THE WAY</div>

</body>
</html>
