<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>चिरञ्जीवी भवः</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
      overflow:hidden;
      position:relative;
    }

    /* Animated Background */
    body::before{
      content:"";
      position:absolute;
      width:200%;
      height:200%;
      background:
        radial-gradient(circle at center,
        rgba(255,255,255,0.06) 0%,
        transparent 60%);
      animation: rotateBg 14s linear infinite;
    }

    @keyframes rotateBg{
      from{
        transform:rotate(0deg);
      }
      to{
        transform:rotate(360deg);
      }
    }

    .container{
      position:relative;
      text-align:center;
      padding:20px;
      z-index:2;
      animation: fadeIn 1.5s ease;
    }

    .main-text{
      font-family:'Noto Serif Devanagari', serif;
      color:#fff;
      font-size:clamp(2.5rem, 8vw, 7rem);
      font-weight:700;
      letter-spacing:2px;
      line-height:1.2;
      animation: glow 4s ease-in-out infinite;
    }

    .sub-text{
      margin-top:18px;
      font-family:'Inter', sans-serif;
      color:rgba(255,255,255,0.75);
      font-size:clamp(0.9rem, 2vw, 1.3rem);
      letter-spacing:10px;
      text-transform:uppercase;
      animation: float 3s ease-in-out infinite;
    }

    .line{
      width:120px;
      height:1px;
      background:#fff;
      margin:22px auto 0;
      opacity:0.6;
      animation: linePulse 3s ease-in-out infinite;
    }

    @keyframes glow{
      0%,100%{
        opacity:0.7;
        transform:scale(1);
        text-shadow:0 0 10px rgba(255,255,255,0.15);
      }

      50%{
        opacity:1;
        transform:scale(1.03);
        text-shadow:
          0 0 12px rgba(255,255,255,0.45),
          0 0 30px rgba(255,255,255,0.2);
      }
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
        opacity:0.6;
      }

      50%{
        transform:translateY(-4px);
        opacity:1;
      }
    }

    @keyframes linePulse{
      0%,100%{
        width:80px;
        opacity:0.3;
      }

      50%{
        width:160px;
        opacity:1;
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media (max-width:768px){

      .sub-text{
        letter-spacing:6px;
      }

      .line{
        margin-top:18px;
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="main-text">चिरञ्जीवी भवः</div>
    <div class="sub-text">ON THE WAY</div>
    <div class="line"></div>
  </div>

</body>
</html>
